app: vjepa_droid
cpus_per_task: 12
folder: /your_folder/droid/behavior-preencoded-vitg16-256px-8f
mem_per_gpu: 220G
nodes: 4
tasks_per_node: 8

data:
  input_type: preencoded
  batch_size: 8
  datasets:
    # CSV manifest for preencoded clips (e.g., episode_id,token_path)
    - /your_file_path/preencoded_behavior_manifest.csv
  dataset_fpcs:
    - 8
  fps: 4
  crop_size: 256
  patch_size: 16
  tubelet_size: 2
  pin_mem: true
  num_workers: 12
  persistent_workers: true
  camera_views:
    - left_mp4_path
  stereo_view: false
  camera_frame: false

data_aug:
  # Kept for compatibility; ignored in preencoded mode.
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  random_resize_aspect_ratio:
    - 0.75
    - 1.35
  random_resize_scale:
    - 1.777
    - 1.777
  reprob: 0.0

loss:
  auto_steps: 2
  loss_exp: 1.0
  normalize_reps: true
  reg_coeff: 0.0

meta:
  dtype: bfloat16
  eval_freq: 100
  resume_checkpoint: null
  load_predictor: false
  pretrain_checkpoint: /your_vjepa2_checkpoints/vitg.pt
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  save_every_freq: 25
  seed: 239
  use_sdpa: true

model:
  model_name: vit_giant_xformers
  pred_depth: 24
  pred_embed_dim: 1024
  pred_is_frame_causal: true
  pred_num_heads: 16
  uniform_power: true
  use_activation_checkpointing: true
  use_extrinsics: false
  use_rope: true

optimization:
  anneal: 15
  epochs: 315
  final_lr: 0.0
  final_weight_decay: 0.04
  ipe: 300
  lr: 0.000425
  start_lr: 0.000075
  warmup: 15
  weight_decay: 0.04
